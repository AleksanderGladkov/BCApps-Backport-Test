name: Backport to 29.x
run-name: Backport PR ${{ inputs.source_pr }} to 29.x (dry run = ${{ inputs.dry_run }})

on:
  workflow_dispatch:
    inputs:
      source_pr:
        description: Merged source PR number in this test fork
        required: true
        type: string
      dry_run:
        description: Preview without creating or changing repository objects
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: backport-demo-${{ github.repository_id }}-${{ inputs.source_pr }}-29
  cancel-in-progress: false

env:
  INPUT_SOURCE_PR: ${{ inputs.source_pr }}
  INPUT_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
  ALLOWED_ACTOR_IDS: ${{ vars.BACKPORT_ALLOWED_ACTOR_IDS || '59250993' }}

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    if: github.repository == 'AleksanderGladkov/BCApps-Backport-Test' && github.repository_id == '1369849596' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/backport-demo
      - name: Check PowerShell runtime
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.4' -or [Environment]::Version -lt [version]'8.0') {
            throw 'PowerShell 7.4+ and .NET 8+ are required.'
          }
      - name: Validate requester, source history and target
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/backport-demo/Invoke-Backport.ps1 -Stage validate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backport-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backport-state
          if-no-files-found: ignore
          retention-days: 7

  track:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/backport-demo
      - name: Check PowerShell runtime
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.4' -or [Environment]::Version -lt [version]'8.0') {
            throw 'PowerShell 7.4+ and .NET 8+ are required.'
          }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backport-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backport-state
      - name: Create or reuse tracking Issue (no writes during dry run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/backport-demo/Invoke-Backport.ps1 -Stage track
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backport-tracking-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backport-state
          if-no-files-found: error
          retention-days: 7

  prepare:
    needs: track
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/backport-demo
      - name: Check PowerShell runtime
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.4' -or [Environment]::Version -lt [version]'8.0') {
            throw 'PowerShell 7.4+ and .NET 8+ are required.'
          }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backport-tracking-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backport-state
      - name: Apply the verified source in an isolated checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/backport-demo/Invoke-Backport.ps1 -Stage prepare
      - name: Save clean result or Milica's conflict handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backport-result-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backport-state
          if-no-files-found: error
          retention-days: 7

  # Milica's resolver is deliberately not invoked yet. A conflict is reported
  # as needs-attention and cannot be published. Add a separate read-only/model
  # job and independent resolution verification before accepting AI patches.
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/backport-demo
      - name: Check PowerShell runtime
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.4' -or [Environment]::Version -lt [version]'8.0') {
            throw 'PowerShell 7.4+ and .NET 8+ are required.'
          }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backport-result-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backport-state
      - name: Recompute and verify the change before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/backport-demo/Invoke-Backport.ps1 -Stage publish
      - name: Preserve publication and recovery evidence, including failures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backport-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backport-state
          if-no-files-found: error
          retention-days: 7
